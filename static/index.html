<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PDF 编辑器</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' rx='5' fill='%232b6cf6'/%3E%3Cpath d='M14 4H7a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V9z' fill='none' stroke='white' stroke-width='1.7'/%3E%3C/svg%3E">
<link rel="stylesheet" href="style.css">
</head>
<body>

<header class="topbar">
  <div class="brand">
    <svg viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="currentColor" stroke-width="1.7">
      <path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/>
      <path d="M14 3v5h5"/><path d="M9 13h6M9 17h4"/>
    </svg>
    <span>PDF 编辑器</span>
  </div>

  <div class="toolgroup">
    <button id="btnOpen" class="btn btn-primary" title="打开 PDF (Ctrl+O)">
      <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 7h6l2 3h10v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>
      打开
    </button>
    <input type="file" id="filePdf" accept=".pdf,application/pdf" hidden>
    <button id="btnExport" class="btn" disabled title="导出 PDF (Ctrl+S)">
      <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 3v12"/><path d="M7 10l5 5 5-5"/><path d="M4 20h16"/></svg>
      导出
    </button>

    <span class="vsep"></span>

    <button id="btnUndo" class="btn btn-icon" disabled title="撤销 (Ctrl+Z)">
      <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 14L4 9l5-5"/><path d="M4 9h11a5 5 0 0 1 0 10h-3"/></svg>
    </button>
    <button id="btnRedo" class="btn btn-icon" disabled title="重做 (Ctrl+Y)">
      <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 14l5-5-5-5"/><path d="M20 9H9a5 5 0 0 0 0 10h3"/></svg>
    </button>

    <span class="vsep"></span>

    <button id="btnAddText" class="btn" disabled title="在页面添加文字">
      <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 6V4h14v2"/><path d="M12 4v16"/><path d="M9 20h6"/></svg>
      文字
    </button>
    <label class="btn" id="lblImage" title="插入图片">
      <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="16" rx="2"/><circle cx="8.5" cy="9.5" r="1.6"/><path d="M21 16l-5-5-6 6"/></svg>
      图片
      <input type="file" id="fileImage" accept="image/*" hidden>
    </label>
    <button id="btnMosaic" class="btn" disabled title="按住鼠标涂抹打马赛克">
      <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="5" height="5" rx="1"/><rect x="10" y="3" width="5" height="5" rx="1"/><rect x="17" y="3" width="4" height="5" rx="1"/><rect x="3" y="10" width="5" height="5" rx="1"/><rect x="10" y="10" width="5" height="5" rx="1"/><rect x="17" y="10" width="4" height="5" rx="1"/><rect x="3" y="17" width="5" height="4" rx="1"/><rect x="10" y="17" width="5" height="4" rx="1"/><rect x="17" y="17" width="4" height="4" rx="1"/></svg>
      马赛克
    </button>

    <span class="vsep"></span>

    <button id="btnFind" class="btn btn-icon" disabled title="查找替换 (Ctrl+F)">
      <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2"><circle cx="10.5" cy="10.5" r="6.5"/><path d="M15.5 15.5L21 21"/></svg>
    </button>

    <div class="menuwrap">
      <button id="btnConvert" class="btn" title="PDF 与 Word 互相转换">
        <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 8h13l-3-3"/><path d="M20 16H7l3 3"/></svg>
        转换
        <svg viewBox="0 0 24 24" width="11" height="11" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M6 9l6 6 6-6"/></svg>
      </button>
      <div class="menu" id="convertMenu">
        <button data-mode="pdf2word">PDF 转 Word（.docx）</button>
        <button data-mode="word2pdf">Word 转 PDF</button>
      </div>
    </div>

    <div class="menuwrap">
      <button id="btnPage" class="btn" disabled title="页面操作">
        <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2"><rect x="4" y="3" width="16" height="18" rx="2"/><path d="M8 8h8M8 12h8M8 16h5"/></svg>
        页面
        <svg viewBox="0 0 24 24" width="11" height="11" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M6 9l6 6 6-6"/></svg>
      </button>
      <div class="menu" id="pageMenu">
        <button data-act="rotate">旋转 90°</button>
        <button data-act="insert">末尾加空白页</button>
        <button data-act="delete" class="danger">删除当前页</button>
      </div>
    </div>
  </div>

  <div class="spacer"></div>

  <div class="zoomctl">
    <button id="zoomOut" class="zbtn">−</button>
    <span id="zoomLabel">100%</span>
    <button id="zoomIn" class="zbtn">+</button>
    <button id="zoomFit" class="zbtn wide" title="适应宽度">适应</button>
  </div>

  <div class="docstat" id="docStat">未打开文档</div>
</header>

<main class="workspace">
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-head">页面 <span id="pageCount" class="badge">0</span></div>
    <div class="thumbs" id="thumbs"></div>
  </aside>

  <section class="viewport" id="viewport">
    <div class="empty" id="empty">
      <img class="empty-art" id="emptyArt" src="empty-state-card.png" alt="">
      <h2>打开一个 PDF 开始编辑</h2>
      <p>把文件拖到这里，或点击下方按钮</p>
      <button class="btn btn-primary lg" id="emptyOpen">选择 PDF 文件</button>
      <div class="hint">纯本地处理 · 不上传云端 · 导出无限制</div>
    </div>

    <div class="stage" id="stage" hidden>
      <div class="page-wrap" id="pageWrap">
        <div class="page" id="page">
          <img id="pageImg" alt="">
          <div class="spanLayer" id="spanLayer"></div>
          <div class="objectLayer" id="objectLayer"></div>
          <canvas id="mosaicCanvas" hidden></canvas>
          <div id="brushRing" hidden></div>
        </div>
      </div>
    </div>
  </section>

  <aside class="inspector" id="inspector">
    <div class="sidebar-head">属性</div>

    <div class="ins-empty" id="insEmpty">
      <p>双击页面文字直接修改，拖动可移动位置</p>
      <ul class="tips">
        <li><b>双击</b> 编辑文字</li>
        <li><b>拖动</b> 移动文字/图片</li>
        <li><b>方向键</b> 微调位置</li>
        <li><b>Delete</b> 删除选中</li>
        <li><b>Ctrl+Z/Y</b> 撤销/重做</li>
      </ul>
    </div>

    <!-- 文字属性 -->
    <div class="ins-body" id="insText" hidden>
      <div class="field">
        <label>内容</label>
        <textarea id="textContent" rows="3" spellcheck="false"></textarea>
      </div>
      <div class="field row2">
        <div>
          <label>字体</label>
          <select id="selFont"></select>
        </div>
        <div>
          <label>字号</label>
          <input type="number" id="inpSize" min="4" max="300" step="0.5">
        </div>
      </div>
      <div class="field row2">
        <div>
          <label>颜色</label>
          <input type="color" id="inpColor">
        </div>
        <div>
          <label>行距</label>
          <input type="number" id="inpLineH" min="0.6" max="4" step="0.05">
        </div>
      </div>
      <div class="field">
        <label>对齐</label>
        <div class="seg" id="alignSeg">
          <button data-align="left" title="左对齐"><svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 6h16M4 12h10M4 18h13"/></svg></button>
          <button data-align="center" title="居中"><svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 6h16M7 12h10M5 18h14"/></svg></button>
          <button data-align="right" title="右对齐"><svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 6h16M10 12h10M7 18h13"/></svg></button>
        </div>
      </div>
      <div class="field">
        <label>样式</label>
        <div class="seg">
          <button id="btnBold" style="font-weight:700">B</button>
          <button id="btnItalic" style="font-style:italic;font-family:Georgia">I</button>
        </div>
      </div>
      <div class="field row2">
        <div>
          <label>X 位置</label>
          <input type="number" id="inpX" step="1">
        </div>
        <div>
          <label>Y 位置</label>
          <input type="number" id="inpY" step="1">
        </div>
      </div>
      <button class="btn full" id="btnRedact">涂白遮盖（彻底删除文字）</button>
      <button class="btn btn-danger full" id="btnDelete">删除这段文字</button>
      <div class="edit-flag" id="editFlag" hidden>此文字块已修改</div>
    </div>

    <!-- 图片属性 -->
    <div class="ins-body" id="insImage" hidden>
      <div class="field row2">
        <div>
          <label>宽度</label>
          <input type="number" id="imgW" min="8" step="1">
        </div>
        <div>
          <label>高度</label>
          <input type="number" id="imgH" min="8" step="1">
        </div>
      </div>
      <div class="field">
        <label>位置</label>
        <div class="meta" id="imgMeta"></div>
      </div>
      <button class="btn btn-danger full" id="btnDelImage">删除这张图片</button>
      <div class="edit-flag">拖动图片移动位置，拖右下角缩放</div>
    </div>
  </aside>
</main>

<!-- 查找替换浮层 -->
<div class="findbar" id="findbar" hidden>
  <div class="findrow">
    <input type="text" id="findInput" placeholder="查找内容">
    <span class="findcount" id="findCount">0</span>
    <button class="btn btn-icon" id="findPrev" title="上一个">↑</button>
    <button class="btn btn-icon" id="findNext" title="下一个">↓</button>
    <button class="btn btn-icon" id="findClose" title="关闭">✕</button>
  </div>
  <div class="findrow">
    <input type="text" id="replInput" placeholder="替换为">
    <button class="btn btn-sm" id="replOne">替换</button>
    <button class="btn btn-sm" id="replAll">全部替换</button>
  </div>
</div>

<div class="dropzone" id="dropzone"><div>松开即可打开 PDF</div></div>
<div class="toast" id="toast"></div>
<div id="mosaicHint" hidden>
  <b>马赛克</b>
  <span>按住左键涂抹</span>
  <i></i>
  <span>滚轮调笔刷</span>
  <i></i>
  <span><kbd>Esc</kbd> 退出</span>
</div>
<div class="loading" id="loading" hidden>
  <div class="spinner"></div>
  <div class="loading-text" id="loadingText"></div>
</div>

<script src="vendor/anime.min.js"></script>
<script src="app.js"></script>
</body>
</html>
