name: Build Windows Installer

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 40

    steps:
      - name: 拉取代码
        uses: actions/checkout@v4

      - name: 配置 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install pymupdf pywebview pyinstaller

      - name: 打包主程序
        run: pyinstaller --noconfirm PDFEditor.spec

      - name: 安装 Inno Setup
        run: choco install innosetup --yes --no-progress

      - name: 生成安装包
        shell: pwsh
        run: |
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { $iscc = "C:\Program Files\Inno Setup 6\ISCC.exe" }
          & $iscc "installer.iss"
          Get-ChildItem dist\PDFEditor-Setup-*.exe | Format-List Name, Length

      - name: 上传安装包
        uses: actions/upload-artifact@v4
        with:
          name: PDFEditor-Installer
          path: dist/PDFEditor-Setup-*.exe
          retention-days: 30

      - name: 上传免安装版
        uses: actions/upload-artifact@v4
        with:
          name: PDFEditor-Portable
          path: dist/PDFEditor/**
          retention-days: 30
