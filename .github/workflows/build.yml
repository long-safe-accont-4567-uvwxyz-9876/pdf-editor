name: Build Windows Installer

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 40

    steps:
      - name: 拉取代码
        uses: actions/checkout@v4

      - name: 配置 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install pymupdf pywebview pyinstaller

      - name: 打包主程序
        run: pyinstaller --noconfirm PDFEditor.spec

      - name: 安装 Inno Setup
        run: choco install innosetup --yes --no-progress

      - name: 生成安装包
        shell: pwsh
        run: |
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { $iscc = "C:\Program Files\Inno Setup 6\ISCC.exe" }
          & $iscc "installer.iss"
          Get-ChildItem dist\PDFEditor-Setup-*.exe | Format-List Name, Length

      - name: 上传安装包
        uses: actions/upload-artifact@v4
        with:
          name: PDFEditor-Installer
          path: dist/PDFEditor-Setup-*.exe
          retention-days: 30

      - name: 上传免安装版
        uses: actions/upload-artifact@v4
        with:
          name: PDFEditor-Portable
          path: dist/PDFEditor/**
          retention-days: 30

      # 发布到 Release，国内镜像站才能代理这个固定链接
      - name: 发布 Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: PDF 编辑器 v1.0.${{ github.run_number }}
          body: |
            自动构建的 Windows 安装包与免安装版。
            安装版：下载 PDFEditor-Setup-*.exe 双击安装。
            免安装版：解压后在文件夹内双击 PDFEditor.exe。
          files: dist/PDFEditor-Setup-*.exe
          draft: false
          prerelease: false
